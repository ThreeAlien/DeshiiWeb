name: Build and Push Angular Docker Image

on:
  push:
    branches:
      - dockerfileTest

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v3

      - name: 設定 Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: 列出所有目錄和檔案
        run: ls -R
      - name: 安裝 Angular 依賴並建構
        run: |
          npm install -g @angular/cli
          npm install
          ng build 
      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}" | docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin

      - name: 建立 Docker 映像
        run: docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/deshiiweb:latest .

      - name: 推送到 Docker Hub
        run: docker push ${{ secrets.DOCKER_HUB_USERNAME }}/deshiiweb:latest
  deploy:
      runs-on: self-hosted  # 讓 GitHub Actions 在 Windows 10 自架 Runner 執行
      needs: build
      steps:
        - name: Pull Latest Docker Image
          run: docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/deshiiweb:latest

        - name: Remove Old Container (If Exists)
          shell: powershell
          run: |
            if (docker ps -a -q -f name=deshiiweb) {
              docker rm -f deshiiweb
            } else {
              Write-Output "No existing container"

        - name: Run New Docker Container
          shell: powershell
          run: |
            docker run -d -p 4200:80 --restart unless-stopped --name deshiiweb ${{ secrets.DOCKER_HUB_USERNAME }}/deshiiweb:latest

        - name: Cleanup Unused Docker Images
          shell: powershell
          run: docker image prune -f